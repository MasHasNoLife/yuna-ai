# Yuna AI configuration. Every value here is optional — anything omitted
# falls back to the defaults in src/yuna/core/config.py.
# Secrets (DISCORD_TOKEN, YUNA_DASHBOARD_TOKEN) belong in .env, never here.

models:
  # 12B QAT sibling of the Gemma4-26B tune: same character, 7.4 GB -> fully on
  # GPU (fast) with room for 8k context. Pull with:
  #   ollama pull hf.co/HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced:Q4_K_M
  # RESEARCH default (fixed chat/extractor model for all paper runs):
  chat: &gemma4q hf.co/HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced:Q4_K_M
  # TESTING (26B-A4B MoE) — swap the two lines above to use for general Yuna:
  # chat: &gemma4q hf.co/HauhauCS/Gemma4-26B-A4B-Uncensored-HauhauCS-Balanced:Q4_K_M
  extractor: *gemma4q          # memory extraction — same model so no eviction
  script: gemma2:27b           # offline reaction scriptwriting
  vision_frames: llava:13b     # video frame analysis
  vision_discord: llava:13b    # discord image understanding
  embedding: nomic-embed-text  # ChromaDB memory embeddings
  whisper_size: medium         # faster-whisper model size (reactions pipeline)

llm:
  backend: ollama              # ollama (primary, local) | google (API, needs GOOGLE_API_KEY)
  format_reminder: true        # per-turn [tag]/format nudge (set false for RP-tuned models)
  think: false                 # hidden reasoning tokens (Gemma 4) — ~10s silence/turn if on
  google_model: gemma-4-26b-a4b-it   # or gemma-4-31b-it (dense, stronger, slower)

endpoints:
  ollama_url: http://localhost:11434
  fish_url: http://127.0.0.1:8880/v1
  vts_host: localhost
  vts_port: 8001

sampling:
  temperature: 0.8
  top_p: 0.9
  repeat_penalty: 1.15
  num_ctx: 8192                # context window — the 12B leaves VRAM headroom for this
  max_history: 30              # realtime chat window (messages)
  discord_max_history: 40      # discord per-channel window (messages)

memory:
  strategy: agentic            # none | full_history | raw_rag | agentic (paper conditions)
  recall_threshold: 0.5        # lower = stricter relevance (question-style queries score ~0.4-0.5)
  dedup_threshold: 0.15        # near-duplicate cutoff on insert (paraphrases ~0.06-0.10)
  delete_threshold: 0.15       # max distance for delete-by-query — near-exact only, so a
                               # FORGET of a nonexistent fact can't nuke a related real one
  n_results: 4                 # memories retrieved per turn (threshold-filtered)

tts:
  backend: kokoro          # kokoro (local) | fish_cloud (API, uses fish_voice below) |
                               # fish_local (INT4). Needs FISH_API_KEY + API credit.
  kokoro_voice: af_heart       # realtime voice (Kokoro)
  kokoro_device: cpu           # cpu | cuda — cpu keeps Kokoro off the GPU (no VRAM fight with the LLM)
  fish_voice: furina           # voice id from voice_reference/voices.json
  fish_model: s2-pro           # local INT4 server model
  fish_cloud_model: s2.1-pro-free  # cloud API model (free tier — no API credit needed)
  fish_cloud_reference_id: ""  # optional fish.audio voice id (skips inline upload)

stt:
  model: small                 # push-to-talk whisper size
  device: cpu                  # cpu keeps VRAM free for the LLM
  compute_type: int8

vision:
  max_frames: 30               # frames sent to the vision model per video
  frame_interval: 2            # seconds between sampled frames
  jpeg_quality: 85

dashboard:
  host: 127.0.0.1              # keep localhost unless you add YUNA_DASHBOARD_TOKEN
  port: 8000

paths:
  data_dir: data               # memory DBs, outputs, tokens, logs
  persona_dir: persona         # your private persona (gitignored)
  persona_example_dir: persona.example
  voice_reference_dir: voice_reference
